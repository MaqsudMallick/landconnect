<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandConnect demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #10231e; color: #e8f1ee; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { margin: 0 0 6px; font-size: 32px; }
  p.lede { margin: 0 0 22px; color: #9fb8b0; font-size: 17px; line-height: 1.5; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  ul { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; margin: 22px 0 0; }
  a.button { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #0f6e56; color: #fff; text-decoration: none; font-weight: 600; }
  a.button:hover, a.button:focus-visible { background: #138a6c; }
  a.button.secondary { background: transparent; border: 1px solid #3c5a52; color: #e8f1ee; }
</style>
</head>
<body>
<main>
  <h1>LandConnect</h1>
  <p class="lede">Land marketplace prototype with in-app voice and video calls. React Native (Expo) and TypeScript, Supabase and LiveKit. The video shows two Android emulators side by side, a buyer and a seller.</p>
  <video controls preload="metadata" poster="poster.jpg">
    <source src="landconnect-demo.mp4" type="video/mp4">
    <a href="landconnect-demo.mp4">Download the demo video</a>
  </video>
  <ul>
    <li><a class="button" href="https://github.com/MaqsudMallick/landconnect">Source code and setup</a></li>
    <li><a class="button secondary" href="https://github.com/MaqsudMallick/landconnect/releases/latest">Android APK</a></li>
    <li><a class="button secondary" href="https://github.com/MaqsudMallick/landconnect/blob/main/docs/ARCHITECTURE.md">Technical documentation</a></li>
    <li><a class="button secondary" href="https://github.com/MaqsudMallick/landconnect/blob/main/docs/AI_USAGE.md">AI tools usage</a></li>
  </ul>
</main>
</body>
</html>
